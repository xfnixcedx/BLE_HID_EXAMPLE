name: Build Fire TV Classic HID remote experiment

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-firetv-classic.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch actual Bluetooth Remote source and submodule
        run: |
          git clone --recursive https://github.com/jqssun/android-bt-remote.git classic-remote
          cd classic-remote
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          chmod +x build.sh src/gradlew
          ./build.sh
      - name: Apply Fire TV test branding and HOME command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("classic-remote/src")
          changed=[]
          # Change Bluetooth HID identity advertised by the Android BluetoothHidDevice API.
          for p in root.rglob("*.kt"):
              s=p.read_text()
              if "BluetoothHidDeviceAppSdpSettings(" in s:
                  import re
                  t=re.sub(r'(BluetoothHidDeviceAppSdpSettings\(\s*)"[^"]*"',r'\1"Fire TV Remote Test"',s)
                  if t!=s:
                      p.write_text(t);changed.append(str(p))
          if not changed:
              print("WARNING: SDP constructor not matched; proceeding with unmodified HID identity")
          print("Modified HID SDP:",changed)
          PY
      - name: Compile Android APK
        run: |
          cd classic-remote/src
          ./gradlew assembleDefaultDebug --no-daemon --console=plain > /tmp/firetv-build.log 2>&1 || { grep -n -E "^(e: |FAILURE:|\\* What went wrong:|> |Caused by:|ERROR:|error:)" /tmp/firetv-build.log | tail -80; tail -100 /tmp/firetv-build.log; exit 1; }
          tail -35 /tmp/firetv-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: firetv-classic-hid-test-apk
          path: classic-remote/src/app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

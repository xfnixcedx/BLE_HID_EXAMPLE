name: Build experimental Fire TV BLE APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already include the Android SDK.
      # Avoid setup-android license prompts for optional Google TV add-ons.
      - name: Apply experimental Fire TV BLE patch
        run: python3 patch_firetv.py
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firetv-ble-experimental-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
